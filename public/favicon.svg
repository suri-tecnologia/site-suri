<!--
  SURI Tecnologia — FAVICON (32 x 32)

  Uso: <link rel="icon" href="/favicon.svg" type="image/svg+xml"> (Chrome, Edge, Firefox).
  Um UNICO <path> (6 subcaminhos, todos preenchidos; sem stroke, sem transform, sem máscara).
  Fundo transparente. Cor: primária #0B2A5B; no modo escuro do navegador vira branco (bloco <style>),
  pois o azul escuro some em abas escuras (contraste 1,3:1 sobre #0F1826).

  Simplificações em relação a versions/icon-only.svg, para ler a 16 px:
    - olho com raio de 1,5 unidades (a 16 px é um ponto de ~1,5 px; no original seria 1,1 unidade)
    - orelha 30% maior
    - margem de 1,5 unidades por lado; o S ocupa 29 de 32 de altura (escala 0.1533)
  Nada mais foi alterado: a espessura do traço já cai em ~2,2 px a 16 px.

  Para Safari e para a tela inicial do iOS, gere PNGs a partir de app-icon.svg
  (apple-touch-icon 180 x 180; favicon.ico com 16/32/48 se precisar de compatibilidade antiga):
  o Safari nem sempre usa favicon SVG.
-->
