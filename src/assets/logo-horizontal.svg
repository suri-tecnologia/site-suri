<!--
  SURI Tecnologia — versão HORIZONTAL (ícone + wordmark)

  Uso recomendado: cabeçalho de site, documentos, propostas, faturas, apresentações, rodapé de e-mail.
  É a versão principal da marca. Em fundo claro use a cor primária (#0B2A5B) definindo `color`;
  em fundo escuro use branco (ou a versão mono-white.svg).
  Tamanho mínimo: 120 px de largura na tela (a linha TECNOLOGIA fica com ~5 px de altura de letra);
  30 mm de largura na impressão. Abaixo disso use icon-only.svg.

  Construção (tudo múltiplo da altura do ícone, H = 185.25):
    - ícone: o mesmo <path> de icon-only.svg, só deslocado por translate para o canto (0,0)
    - respiro entre ícone e texto: 0,25 x H = 46.31
    - SURI: Sora 700 em caixa alta, letter-spacing +0,14em, altura de letra 0,40 x H = 74.1
    - TECNOLOGIA: Sora 400 em caixa alta, letter-spacing +0,32em, com a MESMA largura de SURI
      (altura de letra 21.16); fica a 0,10 x H = 18.52 abaixo da base de SURI
    - o bloco de texto é centralizado no eixo do S (y = 95.25), não no topo da orelha
    - as letras estão convertidas em curvas: o arquivo não depende de fonte instalada
      (Sora, licença SIL OFL 1.1, permite converter em curvas para logotipo)
    - viewBox justo ao conteúdo, sem espaço morto. A área de respiro (H/4 em cada lado) é responsabilidade do uso.
-->
